<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vårutställning 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow reading column like a printed wall label, sticky bar with the EN/SV switch, one view per artwork routed on #art-NN */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --fg: #16181d;
  --muted: #5d626b;
  --rule: #d9dbd6;
  --accent: #1f3fb8;
  --accent-ink: #ffffff;
  --sold: #a3261d;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --fg: #eceef1; --muted: #9aa0aa;
    --rule: #2c3038; --accent: #8ea4ff; --accent-ink: #0d1020; --sold: #ff8a7d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --fg: #eceef1; --muted: #9aa0aa;
  --rule: #2c3038; --accent: #8ea4ff; --accent-ink: #0d1020; --sold: #ff8a7d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-display); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--rule);
}
header.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg); text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang { display: inline-flex; border: 1px solid var(--fg); border-radius: 999px; padding: 3px; flex-shrink: 0; }
.lang button {
  font: inherit; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em;
  border: 0; background: transparent; color: var(--fg);
  min-width: 56px; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lang button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

main .wrap { padding-block: 20px 48px; }

/* Artwork view */
.plate { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; background: var(--surface); position: relative; }
.plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plate .ph { position: absolute; inset: 0; }
.no { font-variant-numeric: tabular-nums; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.75rem, 7vw, 2.4rem); line-height: 1.08; letter-spacing: -0.02em; margin: 6px 0 4px; text-wrap: balance; }
.artist { font-size: 1.1rem; font-weight: 500; margin: 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; margin: 20px 0 0; padding: 16px 0; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--rule); font-size: 0.95rem; }
.facts dt { color: var(--muted); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 2px; }
.facts dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.price { font-weight: 700; }
.price.sold { color: var(--sold); }
.story { font-family: var(--font-body); font-size: 1.2rem; line-height: 1.6; margin-top: 24px; max-width: 65ch; }
.story h2 { font-family: var(--font-display); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.story p { margin: 0 0 1em; }
.story p:first-of-type::first-letter { font-weight: 500; }

nav.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
nav.steps a, .all {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-height: 64px; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 4px;
  color: var(--fg); text-decoration: none; background: var(--surface); min-width: 0;
}
nav.steps a small { color: var(--muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
nav.steps a span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.steps a.next { text-align: right; }
.all { margin-top: 12px; text-align: center; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Index view */
.intro h1 { margin-top: 8px; }
.intro p { font-family: var(--font-body); font-size: 1.15rem; color: var(--muted); margin: 8px 0 24px; max-width: 60ch; }
ol.works { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
ol.works a { display: grid; grid-template-columns: 2.5rem 56px 1fr; align-items: center; gap: 14px; padding-block: 12px; border-bottom: 1px solid var(--rule); color: var(--fg); text-decoration: none; }
ol.works .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
ol.works .thumb { width: 56px; height: 70px; border-radius: 3px; overflow: hidden; position: relative; background: var(--surface); }
ol.works .t { min-width: 0; }
ol.works .t b { display: block; font-weight: 600; }
ol.works .t span { color: var(--muted); font-size: 0.9rem; }
.note { margin-top: 28px; font-size: 0.8rem; color: var(--muted); }
.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 16px; }
.qrcard { background: #ffffff; color: #16181d; border: 1px solid var(--rule); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.qrcard img { width: 100%; height: auto; image-rendering: pixelated; display: block; }
.qrcard b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.qrcard span { font-size: 0.85rem; line-height: 1.3; }
.qrcard a { color: #1f3fb8; font-size: 0.8rem; font-weight: 600; }
.qrlink { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; font-size: 0.85rem; }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .25s ease-out; }
  @keyframes in { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

</head>

const UI = {
  en: { work: "Work", of: "of", artist: "Artist", year: "Year", medium: "Medium", size: "Size", price: "Price", sold: "Sold", story: "The story", prev: "Previous", next: "Next", all: "All works" },
  sv: { work: "Verk", of: "av", artist: "Konstnär", year: "År", medium: "Teknik", size: "Storlek", price: "Pris", sold: "Såld", story: "Berättelsen", prev: "Föregående", next: "Nästa", all: "Alla verk" }
};

function getLang() {
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "sv") return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("sv") ? "sv" : "en";
}
let lang = getLang();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmtPrice = p => p == null ? null : new Intl.NumberFormat(lang === "sv" ? "sv-SE" : "en-SE", { style: "currency", currency: "SEK", maximumFractionDigits: 0 }).format(p);

function plate(w) {
  if (w.img) return `<img src="${esc(w.img)}" alt="">`;
  const [a, b] = w.colors;
  return `<div class="ph" style="background:${a}"></div><div class="ph" style="background:${b};inset:58% 0 0 0"></div><div class="ph" style="background:${a};opacity:.55;inset:0 62% 18% 12%"></div>`;
}

function renderIndex() {
  const t = EXHIBITION[lang];
  return `<div class="view intro">
    <h1>${esc(t.name)}</h1><p>${esc(t.intro)}</p>
    <ol class="works">${WORKS.map((w, i) => `<li><a href="#art-${pad(i + 1)}">
      <span class="n">${pad(i + 1)}</span><span class="thumb">${plate(w)}</span>
      <span class="t"><b>${esc(w[lang].title)}</b><span>${esc(w.artist)}, ${w.year}</span></span></a></li>`).join("")}</ol>
    <p class="note">${esc(t.note)}</p></div>`;
}

function renderWork(i) {
  const w = WORKS[i], c = w[lang], u = UI[lang], n = WORKS.length;
  const prev = (i - 1 + n) % n, next = (i + 1) % n;
  const price = fmtPrice(w.price);
  return `<article class="view">
    <div class="plate" role="img" aria-label="${esc(c.title)}">${plate(w)}</div>
    <div class="no">${u.work} ${pad(i + 1)} ${u.of} ${pad(n)}</div>
    <h1>${esc(c.title)}</h1>
    <p class="artist">${esc(w.artist)}</p>
    <dl class="facts">
      <dt>${u.year}</dt><dd>${w.year}</dd>
      <dt>${u.medium}</dt><dd>${esc(c.medium)}</dd>
      <dt>${u.size}</dt><dd>${esc(w.size)}</dd>
      <dt>${u.price}</dt><dd class="price${price ? "" : " sold"}">${price ? esc(price) : u.sold}</dd>
    </dl>
    <section class="story"><h2>${u.story}</h2>${c.story.map(p => `<p>${esc(p)}</p>`).join("")}</section>
    <nav class="steps" aria-label="${u.all}">
      <a href="#art-${pad(prev + 1)}"><small>← ${u.prev}</small><span>${esc(WORKS[prev][lang].title)}</span></a>
      <a class="next" href="#art-${pad(next + 1)}"><small>${u.next} →</small><span>${esc(WORKS[next][lang].title)}</span></a>
    </nav>
    <a class="all" href="#">${u.all}</a>
  </article>`;
}

function renderQR() {
  const sv = lang === "sv";
  return `<div class="view intro">
    <h1>${sv ? "QR-koder" : "QR codes"}</h1>
    <p>${sv ? "En kod per verk. Högerklicka eller håll in en bild för att spara den. Koden ändras aldrig när texten uppdateras." : "One code per work. Right-click or long-press an image to save it. The code never changes when the text is updated."}</p>
    <div class="qrgrid">${WORKS.map((w, i) => `<div class="qrcard">
      <img src="${QR[i]}" alt="QR ${pad(i + 1)}" width="444" height="444">
      <b>${pad(i + 1)}</b><span>${esc(w.en.title)}<br>${esc(w.sv.title)}</span>
      <a href="#art-${pad(i + 1)}">${sv ? "Öppna sidan" : "Open page"} →</a></div>`).join("")}</div></div>`;
}

function render() {
  document.documentElement.lang = lang;
  document.getElementById("brand").textContent = EXHIBITION[lang].name; document.title = EXHIBITION[lang].name;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const m = /^#art-(\d{1,2})$/.exec(location.hash);
  const i = m ? parseInt(m[1], 10) - 1 : -1;
  document.getElementById("app").innerHTML = location.hash === "#qr-codes" ? renderQR() : (i >= 0 && i < WORKS.length) ? renderWork(i) : renderIndex();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
}));
let lastHash = location.hash;
window.addEventListener("hashchange", () => { render(); if (location.hash !== lastHash) window.scrollTo(0, 0); lastHash = location.hash; });
render();
</script>

</body>
</html>
