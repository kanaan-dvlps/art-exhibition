<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="First Life: works by Mahshad Parsi Nezhad, 2026.">
<meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121411" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>First Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: top nav bar (home = artwork list) · one artwork card (title, artist, year) with its story below · thumb-reach pager at the bottom */
:root {
  --bg: #f7f7f4;
  --card: #ffffff;
  --fg: #151613;
  --muted: #55584f;
  --rule: #d6d7cf;
  --accent: #2f5d46;
  --accent-ink: #ffffff;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --pager-h: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121411; --card: #1c1f1b; --fg: #eeefe9; --muted: #a6aa9f; --rule: #30342e;
    --accent: #8cc7a6; --accent-ink: #0f1a14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121411; --card: #1c1f1b; --fg: #eeefe9; --muted: #a6aa9f; --rule: #30342e;
  --accent: #8cc7a6; --accent-ink: #0f1a14; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 18px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* Top navigation bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; }
.navhome {
  display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 10px; margin-left: -10px;
  border-radius: 999px; color: var(--fg); text-decoration: none; font-weight: 600; font-size: 1rem;
}
.navhome svg { width: 22px; height: 22px; flex-shrink: 0; }
.navhome .brand { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1; }
.navhome[aria-current="page"] { cursor: default; }
.lang { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1.5px solid var(--fg); flex-shrink: 0; }
.lang button { min-width: 52px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

main .wrap { padding-block: 24px 32px; }
main.has-pager { padding-bottom: calc(var(--pager-h) + env(safe-area-inset-bottom, 0px)); }

/* Artwork card + story */
.count { font-size: 0.95rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
  padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 16px;
}
.card h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 11vw, 3.4rem); line-height: 1.02; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 20px; margin: 0; padding-top: 16px; border-top: 1px solid var(--rule); }
.card dt { font-size: 0.85rem; font-weight: 600; color: var(--muted); padding-top: 3px; }
.card dd { margin: 0; font-size: 1.15rem; font-weight: 500; min-width: 0; font-variant-numeric: tabular-nums; }
.story { margin-top: 32px; }
.story h2 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.story p { font-size: 1.15rem; line-height: 1.65; margin: 0 0 1em; max-width: 62ch; }

/* Pager */
nav.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--bg); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.pager .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; height: var(--pager-h); }
.pbtn {
  min-height: 56px; border-radius: 999px; border: 1.5px solid var(--fg); background: transparent;
  font-weight: 600; font-size: 1rem; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; color: var(--fg); white-space: nowrap;
}
.pbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pbtn[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.pnum { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }

/* Home: artwork list */
.intro .kicker { font-size: 0.95rem; font-weight: 600; color: var(--muted); margin: 0; }
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(3.2rem, 16vw, 5rem); line-height: .95; margin: 6px 0 12px; }
.intro p { margin: 0; max-width: 46ch; color: var(--muted); }
.list { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.list a {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  min-height: 72px; padding: 12px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--rule);
  color: var(--fg); text-decoration: none;
}
.list .n { display: block; margin-top: 4px; font-family: var(--font-ui); font-size: 0.9rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.list .t { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; min-width: 0; overflow-wrap: anywhere; }
.list .go { font-size: 1.3rem; color: var(--accent); }
.start { margin-top: 24px; }

@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .3s cubic-bezier(0, 0, .2, 1); }
  @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

</head>
<body>
<header class="top">
  <nav class="wrap" aria-label="Main">
    <a class="navhome" href="#" id="navhome"></a>
    <div class="lang" role="group" aria-label="Language / Språk">
      <button type="button" id="btn-sv" data-lang="sv" lang="sv">SV</button>
      <button type="button" id="btn-en" data-lang="en" lang="en">EN</button>
    </div>
  </nav>
</header>
<main id="main"><div class="wrap" id="app"></div></main>
<nav class="pager" id="pager" aria-label="Artworks" hidden><div class="wrap" id="pager-inner"></div></nav>

<script>
// ===== EDIT HERE: exhibition + artworks =====
const EXHIBITION = {
  artist: "Mahshad Parsi Nezhad",
  initial: "M",   // artwork number = initial-year-001, e.g. M-2026-001
  year: 2026,
  en: { name: "First Life", intro: "Works by Mahshad Parsi Nezhad. Choose a work to read its story." },
  sv: { name: "First Life", intro: "Verk av Mahshad Parsi Nezhad. Välj ett verk för att läsa dess berättelse." }
};
// img: photo file for later (e.g. "img/01.jpg"); not shown yet.
// size: dimensions, e.g. "70 × 100 cm". medium: e.g. "Oil on canvas" / "Olja på duk". Leave "" to hide a row.
const WORKS = [
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled I",    story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel I",    story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled II",   story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel II",   story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled III",  story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel III",  story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled IV",   story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel IV",   story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled V",    story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel V",    story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled VI",   story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel VI",   story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled VII",  story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel VII",  story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled VIII", story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel VIII", story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled IX",   story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel IX",   story: ["[Berättelsen bakom verket kommer här.]"] } },
  { img: "", size: "[W × H cm]", en: { medium: "[Medium]", title: "Untitled X",    story: ["[The story behind this work goes here.]"] }, sv: { medium: "[Teknik]", title: "Utan titel X",    story: ["[Berättelsen bakom verket kommer här.]"] } }
];
// ===== END EDIT =====

const UI = {
  en: { of: "of", prev: "Previous", next: "Next", all: "All works", start: "Start with work 1", work: "Work", artist: "Artist", year: "Year", story: "The story", number: "No.", medium: "Medium", size: "Dimensions" },
  sv: { of: "av", prev: "Föregående", next: "Nästa", all: "Alla verk", start: "Börja med verk 1", work: "Verk", artist: "Konstnär", year: "År", story: "Berättelsen", number: "Nr", medium: "Teknik", size: "Mått" }
};
const BACK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>`;

function getLang() {
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "sv") return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("sv") ? "sv" : "en";
}
let lang = getLang();
const N = WORKS.length;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const code = i => `${EXHIBITION.initial}-${EXHIBITION.year}-${String(i + 1).padStart(3, "0")}`;
const $ = id => document.getElementById(id);

function currentIndex() {
  const m = /^#art-(\d{1,2})$/.exec(location.hash);
  const i = m ? parseInt(m[1], 10) - 1 : -1;
  return i >= 0 && i < N ? i : -1;
}

function renderHome() {
  const t = EXHIBITION[lang], u = UI[lang];
  return `<div class="view">
    <section class="intro">
      <p class="kicker">${esc(EXHIBITION.artist)} · ${EXHIBITION.year}</p>
      <h1>${esc(t.name)}</h1>
      <p>${esc(t.intro)}</p>
      <a class="pbtn primary start" href="#art-01">${u.start} →</a>
    </section>
    <ol class="list" aria-label="${u.all}">${WORKS.map((w, i) => `<li><a href="#art-${pad(i + 1)}">
      <span class="t">${esc(w[lang].title)}<span class="n">${code(i)}</span></span><span class="go" aria-hidden="true">→</span></a></li>`).join("")}</ol>
  </div>`;
}

function renderWork(i) {
  const w = WORKS[i], c = w[lang], u = UI[lang];
  const story = (c.story || []).filter(Boolean);
  return `<div class="view">
    <p class="count">${u.work} ${i + 1} ${u.of} ${N}</p>
    <article class="card" aria-labelledby="t">
      <h1 id="t">${esc(c.title)}</h1>
      <dl>${[
        [u.number, code(i)],
        [u.artist, EXHIBITION.artist],
        [u.year, EXHIBITION.year],
        [u.medium, c.medium],
        [u.size, w.size]
      ].filter(r => r[1] !== "" && r[1] != null).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    </article>
    ${story.length ? `<section class="story" aria-labelledby="s"><h2 id="s">${u.story}</h2>${story.map(p => `<p>${esc(p)}</p>`).join("")}</section>` : ""}
  </div>`;
}

function renderPager(i) {
  const u = UI[lang];
  const prev = i > 0 ? `href="#art-${pad(i)}"` : `aria-disabled="true"`;
  const next = i < N - 1 ? `href="#art-${pad(i + 2)}"` : `aria-disabled="true"`;
  $("pager-inner").innerHTML = `
    <a class="pbtn" ${prev}><span aria-hidden="true">←</span> ${u.prev}</a>
    <span class="pnum" aria-label="${u.work} ${i + 1} ${u.of} ${N}">${i + 1} / ${N}</span>
    <a class="pbtn primary" ${next}>${u.next} <span aria-hidden="true">→</span></a>`;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const i = currentIndex(), u = UI[lang], home = $("navhome");
  if (i >= 0) {
    home.innerHTML = `${BACK_ICON}<span>${u.all}</span>`;
    home.removeAttribute("aria-current");
  } else {
    home.innerHTML = `<span class="brand">${esc(EXHIBITION[lang].name)}</span>`;
    home.setAttribute("aria-current", "page");
  }
  $("app").innerHTML = i >= 0 ? renderWork(i) : renderHome();
  $("pager").hidden = i < 0;
  $("main").classList.toggle("has-pager", i >= 0);
  if (i >= 0) renderPager(i);
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
}));
document.addEventListener("keydown", e => {
  const i = currentIndex(); if (i < 0) return;
  if (e.key === "ArrowRight" && i < N - 1) location.hash = `art-${pad(i + 2)}`;
  if (e.key === "ArrowLeft" && i > 0) location.hash = `art-${pad(i)}`;
});
let sx = null, sy = null;
$("app").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("app").addEventListener("touchend", e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  const i = currentIndex(); if (i < 0 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
  if (dx < 0 && i < N - 1) location.hash = `art-${pad(i + 2)}`;
  if (dx > 0 && i > 0) location.hash = `art-${pad(i)}`;
}, { passive: true });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>

</body>
</html>
